include:
  # Patagona gigas
  - board: xiao_ble//zmk
    shield: gigas_unibody rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: gigas-unibody

  # Patagona gigas with dongle
  - board: xiao_ble//zmk
    shield: gigas_dongle prospector_adapter rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: gigas-dongle
  - board: xiao_ble//zmk
    shield: gigas_peripheral rgbled_adapter
    artifact-name: gigas-peripheral

  # Patagona chaski
  - board: xiao_ble//zmk
    shield: chaski_unibody rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: chaski-unibody

  # Patagona chaski with dongle
  - board: xiao_ble//zmk
    shield: chaski_dongle prospector_adapter rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: chaski-dongle
  - board: xiao_ble//zmk
    shield: chaski_peripheral rgbled_adapter
    artifact-name: chaski-peripheral

  # Settings reset file
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: xiao-ble-reset
